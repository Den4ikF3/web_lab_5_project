<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments :: head('Автомобілі')}"></head>
<body>
<div th:replace="~{fragments :: menu}"></div>
<div class="content">
    <h1>Автомобілі</h1>
    <ul class="msg" th:if="${message}"><li class="info" th:text="${message}"></li></ul>

    <form th:action="@{/cars}" th:object="${car}" method="post">
        <h2 th:text="${car.id == null} ? 'Новий автомобіль' : 'Редагування автомобіля'">Новий автомобіль</h2>
        <input type="hidden" th:field="*{id}">
        <table class="form">
            <tr>
                <td><label for="plate">Держномер:</label></td>
                <td><input type="text" th:field="*{plate}" maxlength="15">
                    <span class="err" th:if="${#fields.hasErrors('plate')}" th:errors="*{plate}"></span></td>
            </tr>
            <tr>
                <td><label for="brand">Марка:</label></td>
                <td><input type="text" th:field="*{brand}" maxlength="50">
                    <span class="err" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span></td>
            </tr>
            <tr>
                <td><label for="model">Модель:</label></td>
                <td><input type="text" th:field="*{model}" maxlength="50">
                    <span class="err" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></span></td>
            </tr>
            <tr>
                <td><label for="year">Рік випуску:</label></td>
                <td><input type="number" th:field="*{year}">
                    <span class="err" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span></td>
            </tr>
            <tr>
                <td><label for="ownerName">Власник:</label></td>
                <td><input type="text" th:field="*{ownerName}" maxlength="100">
                    <span class="err" th:if="${#fields.hasErrors('ownerName')}" th:errors="*{ownerName}"></span></td>
            </tr>
        </table>
        <p>
            <button type="submit" th:text="${car.id == null} ? 'Додати' : 'Зберегти'">Додати</button>
            <a class="button" th:if="${car.id != null}" th:href="@{/cars}">Скасувати</a>
        </p>
    </form>

    <h2>Список автомобілів</h2>
    <table class="grid">
        <tr>
            <th>ID</th><th>Держномер</th><th>Марка</th><th>Модель</th><th>Рік</th><th>Власник</th><th>Дії</th>
        </tr>
        <tr th:each="c : ${cars}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.plate}"></td>
            <td th:text="${c.brand}"></td>
            <td th:text="${c.model}"></td>
            <td th:text="${c.year}"></td>
            <td th:text="${c.ownerName}"></td>
            <td>
                <a class="button" th:href="@{/cars(edit=${c.id})}">Редагувати</a>
                <form class="inline" th:action="@{/cars/{id}/delete(id=${c.id})}" method="post"
                    th:data-plate="${c.plate}"
                    onsubmit="return confirm('Видалити автомобіль ' + this.dataset.plate + ' разом з усіма його ремонтами?');">
                    <button type="submit">Видалити</button>
                </form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
